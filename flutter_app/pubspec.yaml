name: cse_compass
description: "A smart, reminder-driven academic planner engineered exclusively for a B.Tech Computer Science and Engineering student."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.3
  intl: ^0.19.0
  share_plus: ^9.0.0
  file_picker: ^8.0.5
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
